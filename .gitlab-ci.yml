stages:
  - build_and_push

build:
  stage: build_and_push
  variables:
    GIT_STRATEGY: clone
  script:
    - bash ./files/deployment-stuff/pre-build.sh
    - printf '%s' "$AFACTORY_TOKEN" | docker login -u "$AFACTORY_USER" --password-stdin "$AFACTORY_HOST"
    - docker build --no-cache --build-arg CACHEBUST="$(date +%s)" -t "encompass:$CI_COMMIT_TAG" .
    # Push the image using the tag number from the git tag
    - docker tag "encompass:$CI_COMMIT_TAG" "$AFACTORY_HOST/geant-devops-docker/encompass:$CI_COMMIT_TAG"
    - docker image push "$AFACTORY_HOST/geant-devops-docker/encompass:$CI_COMMIT_TAG"
    # Push the image using the 'latest' tag
    - curl -u "${AFACTORY_USER}:${AFACTORY_TOKEN}" -X DELETE "https://${AFACTORY_HOST}/artifactory/geant-devops-docker/encompass/latest"
    - docker tag "encompass:$CI_COMMIT_TAG" "$AFACTORY_HOST/geant-devops-docker/encompass:latest"
    - docker image push "$AFACTORY_HOST/geant-devops-docker/encompass:latest"
  only:
    - tags
  tags:
    - shared-global-shell-runner
