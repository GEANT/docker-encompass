stages:
  - build_and_push

variables:
  GIT_STRATEGY: clone
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  CODEBERG_HOST: codeberg.org
  CODEBERG_OWNER: GEANT
  CODEBERG_REPO: docker-encompass
  GOTOOLCHAIN: local

.docker_build_and_push:
  stage: build_and_push
  only:
    - tags
  tags:
    - shared-global-shell-runner
  script:
    - chmod +x ./files/ci/push-containers-codeberg.sh
    - ./files/ci/push-containers-codeberg.sh

.go_binary_build:
  stage: build_and_push
  only:
    - tags
  tags:
    - shared-global-shell-runner
  artifacts:
    name: "$TOOL_NAME-$CI_COMMIT_TAG"
    paths:
      - dist/$TOOL_NAME/
    expire_in: 30 days
  script:
    - chmod +x ./files/ci/push-artifacts-codeberg.sh
    - ./files/ci/push-artifacts-codeberg.sh "$TOOL_NAME" "$TOOL_DIR"

build_encompass:
  extends: .docker_build_and_push
  variables:
    SERVICE_NAME: encompass

build_encapsule:
  extends: .docker_build_and_push
  variables:
    SERVICE_NAME: encapsule

build_encryptor:
  extends: .go_binary_build
  variables:
    TOOL_NAME: encryptor
    TOOL_DIR: cmd/encryptor

build_decryptor:
  extends: .go_binary_build
  variables:
    TOOL_NAME: decryptor
    TOOL_DIR: cmd/decryptor
