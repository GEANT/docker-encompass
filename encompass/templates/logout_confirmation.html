{% extends "shared/common.html" %}

{% block content %}
      <div class="text-center">
        <div class="page-header">
          <h2 class="text-primary">enCompass Node Classifier</h2>
        </div>
        <p class="text-primary">Are you sure you want to logout?</p>
        <form class="form-horizontal" action="{% url 'logout' %}" method="post">
          <div class="form-group">
            {% csrf_token %}
            <input type="hidden" name="tform_group" value="{{ tform_group }}" />
            <input type="hidden" name="encompass_email" value="{{ encompass_email }}" />
            <input type="hidden" name="disp_name" value="{{ disp_name }}" />
            <br />
            <form action="{% url 'logout' %}" method="post">
              {% csrf_token %}
              <a type="button" class="btn btn-outline-primary btn-sm" href="/encompass">Cancel</a>
              &nbsp;<button type="submit" class="btn btn-danger">Logout</button>
            </form>           
          </div>
        </form>
      </div>
{% endblock %}
