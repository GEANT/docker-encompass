{% extends "shared/common.html" %}

{% block content %}
      <div class="text-center">
        <div class="page-header">
          <h2 class="text-primary">enCompass Node Classifier</h2>
          <p class="text-muted">Add New Group</p>
        </div>
        </br />
        
        <div class="card mx-auto" style="max-width: 800px;">
          <div class="card-body text-start">
            <form id="addGroupForm" method="post" action="/encompass/groups/add">
              {% csrf_token %}
              
              <div class="mb-3">
                <label for="groupname" class="form-label"><strong>Group Name *</strong></label>
                <input type="text" class="form-control" id="groupname" name="groupname" required placeholder="web_servers">
                <div class="form-text">Unique name for this group</div>
              </div>

              <div class="mb-3">
                <label class="form-label"><strong>Environment</strong></label>
                {% if feature_branch %}
                <input type="text" class="form-control" name="environment" placeholder="production">
                {% else %}
                <select class="form-select" name="environment">
                  {% for env in puppet_environments %}
                  <option value="{{ env }}">{{ env }}</option>
                  {% endfor %}
                </select>
                {% endif %}
              </div>

              <div class="mb-3">
                <label class="form-label"><strong>Classes</strong></label>
                <div id="classes-list">
                  <div class="input-group mb-2 class-item">
                    <input type="text" class="form-control" name="classes[]" placeholder="profile::example">
                    <button type="button" class="btn btn-outline-secondary" data-remove-class>Remove</button>
                  </div>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm" id="add-class">Add class</button>
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <strong>Hosts</strong>
                  <span
                    class="text-muted ms-1"
                    data-group-hosts-popover
                    data-bs-toggle="popover"
                    data-bs-trigger="hover focus"
                    data-bs-placement="top"
                    data-bs-title="Hosts selector help"
                    data-bs-content="Plain values do prefix match (for example web-). Regex values must be wrapped in /.../ and use full match, for example /^web-[0-9]+\\.example\\.com$/."
                    tabindex="0"
                    role="button"
                    aria-label="Hosts selector help"
                    style="cursor: pointer;"
                  >
                    <i class="bi bi-question-circle"></i>
                  </span>
                </label>
                <div id="hosts-list">
                  <div class="input-group mb-2 host-item">
                    <input type="text" class="form-control" name="hosts[]" placeholder="hostname.example.com">
                    <button type="button" class="btn btn-outline-secondary" data-remove-host>Remove</button>
                  </div>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm" id="add-host">Add host</button>
              </div>

              <div class="mb-3">
                <label class="form-label"><strong>Parameters</strong></label>
                <div id="parameters-list">
                  <div class="row g-2 mb-2 parameter-item">
                    <div class="col-md-5">
                      <input type="text" class="form-control" name="param_keys[]" placeholder="parameter key">
                    </div>
                    <div class="col-md-5">
                      <input type="text" class="form-control" name="param_values[]" placeholder="parameter value">
                    </div>
                    <div class="col-md-2 d-grid">
                      <button type="button" class="btn btn-outline-secondary" data-remove-parameter>Remove</button>
                    </div>
                  </div>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm" id="add-parameter">Add parameter</button>
              </div>

              <div class="d-flex justify-content-between mt-4">
                <a href="/encompass/groups" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Group</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <script>
        (function() {
          function initializeHelpPopovers(root = document) {
            if (typeof bootstrap === 'undefined' || !bootstrap.Popover) return;

            root.querySelectorAll('[data-group-hosts-popover]').forEach((element) => {
              bootstrap.Popover.getOrCreateInstance(element, {
                trigger: 'hover focus',
                placement: 'top',
                delay: { show: 0, hide: 80 },
                container: 'body',
              });
            });
          }

          initializeHelpPopovers(document);

          function escapeHtml(value) {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          // Add class handler
          document.getElementById('add-class').addEventListener('click', function() {
            const classesList = document.getElementById('classes-list');
            const newClass = `
              <div class="input-group mb-2 class-item">
                <input type="text" class="form-control" name="classes[]" placeholder="profile::example">
                <button type="button" class="btn btn-outline-secondary" data-remove-class>Remove</button>
              </div>
            `;
            classesList.insertAdjacentHTML('beforeend', newClass);
          });

          // Add host handler
          document.getElementById('add-host').addEventListener('click', function() {
            const hostsList = document.getElementById('hosts-list');
            const newHost = `
              <div class="input-group mb-2 host-item">
                <input type="text" class="form-control" name="hosts[]" placeholder="hostname.example.com">
                <button type="button" class="btn btn-outline-secondary" data-remove-host>Remove</button>
              </div>
            `;
            hostsList.insertAdjacentHTML('beforeend', newHost);
          });

          // Add parameter handler
          document.getElementById('add-parameter').addEventListener('click', function() {
            const parametersList = document.getElementById('parameters-list');
            const newParam = `
              <div class="row g-2 mb-2 parameter-item">
                <div class="col-md-5">
                  <input type="text" class="form-control" name="param_keys[]" placeholder="parameter key">
                </div>
                <div class="col-md-5">
                  <input type="text" class="form-control" name="param_values[]" placeholder="parameter value">
                </div>
                <div class="col-md-2 d-grid">
                  <button type="button" class="btn btn-outline-secondary" data-remove-parameter>Remove</button>
                </div>
              </div>
            `;
            parametersList.insertAdjacentHTML('beforeend', newParam);
          });

          // Event delegation for remove buttons
          document.addEventListener('click', function(event) {
            if (event.target.matches('[data-remove-class]')) {
              const classItems = document.querySelectorAll('.class-item');
              if (classItems.length > 1) {
                event.target.closest('.class-item').remove();
              }
            }
            
            if (event.target.matches('[data-remove-host]')) {
              event.target.closest('.host-item').remove();
            }
            
            if (event.target.matches('[data-remove-parameter]')) {
              event.target.closest('.parameter-item').remove();
            }
          });

          // Form submission validation
          document.getElementById('addGroupForm').addEventListener('submit', function(e) {
            const classInputs = document.querySelectorAll('#classes-list input[name="classes[]"]');
            const hasValidClass = Array.from(classInputs).some(input => input.value.trim() !== '');
            
            if (!hasValidClass) {
              e.preventDefault();
              alert('At least one class is required to create a group.');
            }
          });
        })();
      </script>
{% endblock %}
