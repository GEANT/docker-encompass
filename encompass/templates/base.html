{% extends "shared/common.html" %}

{% block content %}
      <div class="text-center">
        <div class="page-header">
          <h2 class="text-primary">enCompass Node Classifier</h2>
        </div>
        <p class="text-primary">Make your selection</p>

        <form class="form-horizontal mx-auto" style="width: 700px;" action="/encompass/vm_common/" method="post">
          {% csrf_token %}
          <input type="hidden" name="tform_folder" value="{{ tform_folder }}" />
          <input type="hidden" name="encompass_email" value="{{ encompass_email }}" />
          <input type="hidden" name="disp_name" value="{{ disp_name }}" />
          <input type="hidden" name="group_name" value="{{ group_name }}" />
          <div class="form-group">
            <table class="table table-hover table vertical-align-middle">
              <caption>VM provisioning information</caption>
              <colgroup>
                <col style="width: 40%;" />
                <col style="width: 60%;" />
              </colgroup>
              <thead>
                <tr>
                  <th scope="col" class="custom-text-right">Provisioning information&nbsp;&nbsp;&nbsp;&nbsp;</th>
                  <th scope="col" class="custom-text-left">selection</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <label class="control-label col custom-item-right" for="schema_name">Folder (application name)</label>
                  </td>
                  <td>
                    <select class="form-control" name="folder_type" onchange="menuSelectFolder(this);" required>
                      <option value="" selected disabled>&lt;Folder Type&gt;</option>
                      <option id="existing_folder">Existing</option>
                      <option id="new_folder">New</option>
                    </select>
                  </td>
                </tr>
                <tr id="existingFolder" style="display:none;">
                  <td>
                    <label class="control-label col custom-item-right" for="schema_name">Existing Folder</label>
                  </td>
                  <td>
                    <select class="form-control" id="existingFolderSelect" name="existingfoldername" size="10">
                      <option value="" selected disabled>&lt;Choose Existing Folder&gt;</option>
                      {% for folder in folders %}
                        <option value="{{ folder }}">{{ folder }}</option>
                      {% endfor %}
                    </select>
                  </td>
                </tr>
                <tr id="newFolder" style="display:none;">
                  <td>
                    <label class="control-label col custom-item-right" for="schema_name">Folder</label>
                  </td>
                  <td>
                    <input type="text" class="form-control" id="newFolderText" name="newfoldername" placeholder="<Folder-Name>" />
                  </td>
                </tr>
                <tr>
                  <td>
                    <label class="control-label col custom-item-right" for="schema_name">Subfolder (environment)</label>
                  </td>
                  <td>
                    <select class="form-control" name="subfoldername" required>
                      <option value="" selected disabled>&lt;Choose Subfolder name&gt;</option>
                      <option value="test">Test</option>
                      <option value="uat">UAT</option>
                      <option value="prod">Production</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="form-group">
            <br />
            <div class="col">
              <button type="submit" class="btn btn-primary">Confirm selection</button>
            </div>
          </div>
        </form>
      </div>
      <script>
        function menuSelectFolder(nameSelect) {
          if (nameSelect) {
            const existingFolder_Value = document.getElementById('existing_folder').value
            const newFolder_Value = document.getElementById('new_folder').value
            const existingFold = document.getElementById('existingFolder')
            const newFold = document.getElementById('newFolder')
            const newFoldText = document.getElementById('newFolderText')
            const existingFolderSelect = document.getElementById('existingFolderSelect')
            if (existingFolder_Value == nameSelect.value) {
              newFoldText.value = ''
              existingFold.style.display = 'table-row'
              newFold.style.display = 'none'
            } else if (newFolder_Value == nameSelect.value) {
              existingFolderSelect.selectedIndex = 0
              existingFold.style.display = 'none'
              newFold.style.display = 'table-row'
            } else {
              existingFold.style.display = 'none'
              newFold.style.display = 'none'
            }
          }
        }
      </script>
{% endblock %}
